<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mente Leve · Seleção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@500;700;800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07140f;
      --bg-2: #0d2219;
      --card: #12281e;
      --line: #1e3d30;
      --ink: #f3f0e6;
      --dim: #8eaa9a;
      --green: #7ddb8c;
      --green-2: #c8f5c0;
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "Geist", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }
    canvas#grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
    }
    .gate {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      background:
        radial-gradient(circle at 20% 30%, rgba(29, 92, 58, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(16, 50, 35, 0.3) 0%, transparent 40%);
    }
    .kicker {
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 0.75rem;
      color: var(--green);
      font-weight: 600;
      margin-bottom: 1.2rem;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(2.8rem, 7vw, 4.8rem);
      line-height: 0.92;
      font-weight: 400;
      margin-bottom: 1rem;
    }
    h1 em { color: var(--green); font-style: italic; }
    .sub {
      color: var(--dim);
      font-size: 1.1rem;
      max-width: 34ch;
      margin-bottom: 2.5rem;
      line-height: 1.45;
    }
    .gate-actions {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      width: 100%;
      max-width: 340px;
    }
    .go {
      background: var(--green);
      color: #06210f;
      border: 0;
      border-radius: 999px;
      padding: 0.95rem 1.4rem;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      font-family: var(--sans);
      text-decoration: none;
      display: block;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 20px rgba(125, 219, 140, 0.15);
    }
    .go:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(125, 219, 140, 0.25); }
    .go.alt {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    .go.alt:hover { background: rgba(255,255,255,0.03); }
    .go.ghost {
      background: transparent;
      color: var(--dim);
      border: 1px solid transparent;
      font-size: 0.95rem;
      box-shadow: none;
    }
    .go.ghost:hover { color: var(--ink); }
    .logo-mark {
      margin-bottom: 1.5rem;
      font-family: var(--serif);
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      color: var(--green-2);
      opacity: 0.85;
    }
    @media (max-width: 600px) {
      h1 { font-size: clamp(2.4rem, 10vw, 3.6rem); }
      .sub { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <canvas id="grid"></canvas>
  <div class="gate">
    <div class="logo-mark">MENTE LEVE</div>
    <p class="kicker">Eurofarma · EuroCuida · last mile</p>
    <h1>Ache o remédio<br /><em>como se fosse um alvo.</em></h1>
    <p class="sub">Não é e-commerce. É radar de estoque + missão da farmácia. Escolha como entrar.</p>
    <div class="gate-actions">
      <a href="login.html" class="go">Sou paciente</a>
      <a href="balcao/index.html" class="go alt">Sou a farmácia</a>
      <a href="euro.html" class="go ghost">Ver para a Eurofarma</a>
    </div>
  </div>

  <!-- VLibras -->
  <link rel="stylesheet" href="vlibras-copia/widget-mente-leve.css">
  <script src="vlibras-copia/widget-mente-leve.js" defer></script>

  <script>
    // Subtle grid background
    const canvas = document.getElementById('grid');
    const ctx = canvas.getContext('2d');
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      draw();
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(125, 219, 140, 0.08)';
      ctx.lineWidth = 1;
      const gap = 40;
      for (let x = 0; x < canvas.width; x += gap) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gap) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
    }
    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
