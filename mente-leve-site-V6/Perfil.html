<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mente Leve - Perfil</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="perfil/perfil.css">
</head>

<body>

  <div class="app-container">

    <!-- Cabeçalho -->
    <header class="top-header">
      <!-- Botão Voltar -->
      <a href="principal.html" class="btn-back">
        <i class="bi bi-chevron-left"></i>
      </a>

      <div class="header-title">Perfil & Saúde</div>
    </header>

    <!-- Área de Informações do Usuário -->
    <div class="user-profile-section">
      <div class="avatar-wrapper">
        <img id="foto_perfil" alt="Perfil" class="avatar-inner">
      </div>
      <div class="user-name" id="nome">Flavio Henrique</div>
      <div class="user-status">Premium Member</div>
    </div>

    <!-- Lista de Opções -->
    <div class="profile-menu">

      <!-- Meus Pedidos -->
      <a href="pedidos.html" class="menu-item">
        <div class="menu-left">
          <i class="bi bi-box-seam"></i> Meus Pedidos
        </div>
        <i class="bi bi-chevron-right menu-arrow"></i>
      </a>

      <!-- Receitas Médicas (Com Área de Upload Embutida) -->
      <div class="menu-item-expandable">
        <div class="menu-item-header">
          <div class="menu-left">
            <i class="bi bi-file-medical"></i> Receitas Médicas
          </div>
          <i class="bi bi-chevron-down menu-arrow"></i>
        </div>

        <!-- Box de Upload -->
        <div class="upload-box">
          <i class="bi bi-cloud-arrow-up"></i>
          <a href="LeitorReceita.html">Upload de Nova Receita</a>
        </div>
      </div>

      <!-- Meus Dados -->
      <a href="Dados.html" class="menu-item">
        <div class="menu-left">
          <i class="bi bi-person-vcard"></i> Meus Dados
        </div>
        <i class="bi bi-chevron-right menu-arrow"></i>
      </a>

      <!-- Configurações -->
      <a href="configuracoes.html" class="menu-item mb-4">
        <div class="menu-left">
          <i class="bi bi-gear"></i> Configurações
        </div>
        <i class="bi bi-chevron-right menu-arrow"></i>
      </a>

    </div> <!-- Fim da Lista -->

    <!-- Botão Sair (Empurrado para o final da tela) -->
    <a href="login.html"><button class="btn btn-logout w-100 mb-2">Sair da Conta</button></a>
    <a href="index.html"><button class="btn btn-outline-light w-100" style="border-radius:12px; padding:0.7rem;">← Voltar à seleção inicial</button></a>

  </div> <!-- Fim do App Container -->


  <!-- VLibras (governo) · avatar rotulado Mente Leve -->
  <link rel="stylesheet" href="vlibras-copia/widget-mente-leve.css">
  <script src="vlibras-copia/widget-mente-leve.js" defer></script>
</body>

<script>
  // Recupera o nome salvo no localStorage
  const nomeSalvo = localStorage.getItem("usuarioNome");

  // Exemplo: se houver um elemento com id="boasVindas", injeta o nome nele
  if (nomeSalvo) {
    document.getElementById("nome").textContent = nomeSalvo;
    document.getElementById("foto_perfil").src = `https://ui-avatars.com/api/?name=${nomeSalvo}&background=a855f7&color=fff`

  }
</script>

</html>
