<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mente Leve - Configurações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="configuracoes/configuracoes.css">
</head>

<body>
  <div class="app-container">
    <header class="top-header">
      <a href="Perfil.html" class="btn-back"><i class="bi bi-chevron-left"></i></a>
      <div class="header-title">Configurações</div>
    </header>

    <div class="settings-group">
      <div class="settings-item">
        <div class="item-left"><i class="bi bi-bell-fill"></i> Notificações Push</div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" checked>
        </div>
      </div>
      <div class="settings-item">
        <div class="item-left"><i class="bi bi-fingerprint"></i> Biometria / Face ID</div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox">
        </div>
      </div>
    </div>

    <div class="settings-group">
      <a href="#" class="settings-item">
        <div class="item-left"><i class="bi bi-shield-lock-fill"></i> Privacidade e Segurança</div>
        <i class="bi bi-chevron-right text-white-50"></i>
      </a>
      <a href="#" class="settings-item">
        <div class="item-left"><i class="bi bi-headset"></i> Central de Ajuda</div>
        <i class="bi bi-chevron-right text-white-50"></i>
      </a>
      <a href="#" class="settings-item">
        <div class="item-left"><i class="bi bi-info-circle-fill"></i> Sobre o Mente Leve</div>
        <i class="bi bi-chevron-right text-white-50"></i>
      </a>
    </div>
  </div>

  <!-- VLibras (governo) · avatar rotulado Mente Leve -->
  <link rel="stylesheet" href="vlibras-copia/widget-mente-leve.css">
  <script src="vlibras-copia/widget-mente-leve.js" defer></script>
</body>

</html>
