<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mente Leve - Meus Dados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="dados/dados.css">
</head>

<body>
  <div class="app-container">
    <header class="top-header">
      <a href="Perfil.html" class="btn-back"><i class="bi bi-chevron-left"></i></a>
      <div class="header-title">Meus Dados</div>
    </header>

    <div class="form-section-title">Informações Pessoais</div>

    <div class="custom-input-box">
      <i class="bi bi-person"></i>
      <input type="text" id="nomeUsuario" placeholder="Nome Completo">
    </div>
    <div class="custom-input-box">
      <i class="bi bi-envelope"></i>
      <input type="email" id="mail" placeholder="E-mail">
    </div>
    <div class="custom-input-box">
      <i class="bi bi-telephone"></i>
      <input type="tel" value="" placeholder="Telefone">
    </div>

    <div class="form-section-title mt-3">Endereço de Entrega</div>

    <div class="custom-input-box">
      <i class="bi bi-geo-alt"></i>
      <input type="text" value="Rua Mente Leve, 123" placeholder="Endereço Completo">
    </div>
    <div class="custom-input-box">
      <i class="bi bi-map"></i>
      <input type="text" value="São Paulo - SP" placeholder="Cidade / Estado">
    </div>
  <a href="principal.html"><button class="btn-save mt-4" id="salvar">Salvar Alterações</button><a></a>
  </div>

  <!-- VLibras (governo) · avatar rotulado Mente Leve -->
  <link rel="stylesheet" href="vlibras-copia/widget-mente-leve.css">
  <script src="vlibras-copia/widget-mente-leve.js" defer></script>
</body>

<script>
  // Recupera o nome salvo no localStorage
  const nomeSalvo = localStorage.getItem("usuarioNome");
  const emailSalvo = localStorage.getItem("Email");

  // Exemplo: se houver um elemento com id="boasVindas", injeta o nome nele
  if (nomeSalvo) {
    document.getElementById("nomeUsuario").value = nomeSalvo;
  }

  if (emailSalvo) {
    document.getElementById("mail").value = emailSalvo;
  }

  function salvar() {
    const nameInput = document.getElementById("nomeUsuario").value;
    const emailInput = document.getElementById("mail").value;
    // Salva o nome no localStorage do navegador
    localStorage.setItem("usuarioNome", nameInput);
    localStorage.setItem("Email", emailInput);
  }

  document.getElementById("salvar").addEventListener('click', salvar);
</script>

</html>
